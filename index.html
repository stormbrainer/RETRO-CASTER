/**

 *
 * [v29 PATCHES]
 * - [PATCH] Anti-Tamper: FNV-1a hash of own function bodies verified on every validate() call
 * - [PATCH] Unicode Confusable Normalization: UTS #39 confusables stripped before pattern matching
 * - [PATCH] Emoji/Sticker Bypass: Zero-width, emoji, and control characters removed
 * - [PATCH] Session Rate Limiting: Max 20 messages per 10s per session, burst-3

 * - [PATCH] Deep Freeze: All public methods are non-configurable, non-writable
 * - [PATCH] Closure Integrity: No leaked references — _sessions truly private
 * - [PATCH] Phonetic Pipeline: Improved homoglyph + leet + phonetic triple-pass
 * - [PATCH] Repetition Attack: Identical messages within 2s window are dropped
 * - [PATCH] Length Heuristic: Messages > 2000 chars auto-flagged for review
 */

const NeuralGuard = (() => {
    'use strict';

    // --- PRIVATE SCOPE: Unreachable from window or console ---
    const _sessions = new Map();
    let _selfHash = 0;

    const CONFIG = Object.freeze({
        INTEGRITY_MAX: 100,
        SENSITIVE_WINDOW: 60000,
        SESSION_TTL_MS: 1800000,       // 30 min inactivity → expire
        RATE_LIMIT_WINDOW: 10000,      // 10s window
        RATE_LIMIT_MAX: 20,             // max 20 msgs per window
        RATE_LIMIT_BURST: 3,            // burst-3 then throttle
        REPEAT_WINDOW: 2000,           // 2s repeat detection
        MAX_MSG_LEN: 2000,             // over this = flagged
        GHOST_VARIETY: Object.freeze([
            "Nice weather today.", "Cool.", "I'm just chilling.",
            "Yeah, I see.", "Maybe later.", "Not much going on.",
            "Hmm, interesting.", "Sure thing.", "Got it.", "Okay then."
        ]),
        VOWEL_MAP: Object.freeze({ 'a':'1', 'e':'2', 'i':'3', 'o':'4', 'u':'5', 'y':'3' }),
        HOMOGLYPH_MAP: Object.freeze({
            '0':'o', '1':'i', '3':'e', '4':'a', '5':'s', '7':'t', '8':'b', '9':'g',
            '@':'a', '$':'s', '!':'i', '+':'t', '(':  'c', '|':'i', '<':'c',
            '\u0430':'a','\u0435':'e','\u043e':'o','\u0440':'p','\u0441':'c','\u0443':'y','\u0445':'x',
            '\u00e0':'a','\u00e9':'e','\u00ed':'i','\u00f3':'o','\u00fa':'u',
            '\u0131':'i','\u015f':'s','\u00e7':'c','\u011f':'g','\u00f0':'d','\u00fe':'p',
        }),
        // Zero-width and invisible characters to strip
        INVISIBLE_CHARS: Object.freeze([
            '\u200B','\u200C','\u200D','\u200E','\u200F','\u2060','\u2061','\u2062','\u2063',
            '\uFEFF','\u00AD','\u115F','\u1160','\u3164','\uFFA0',
        ]),
    });

    const LEXICON = Object.freeze({
        CRITICAL: Object.freeze(["nigger", "faggot", "pedophile", "pussy", "vagina", "clit", "cunt", "dick"]),
        SENSITIVE: Object.freeze(["touch", "finger", "meetup", "nude", "nudes", "send pic", "show me"]),
        EXEMPTIONS: Object.freeze([
            "fingernail", "fingerprint", "fussy", "grass", "glass", "feel", "paint",
            "meeting room", "touchscreen", "touch screen", "finger food"
        ]),
    });

    // --- FNV-1a hash for self-integrity ---
    function _fnv1a(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 0x01000193);
        }
        return h >>> 0;
    }

    // --- Compute self hash at init ---
    function _computeSelfHash() {
        const pieces = [
            CONFIG.GHOST_VARIETY.length.toString(),
            LEXICON.CRITICAL.length.toString(),
            LEXICON.SENSITIVE.length.toString(),
            Object.keys(CONFIG.HOMOGLYPH_MAP).length.toString(),
            Object.keys(CONFIG.VOWEL_MAP).length.toString(),
        ].join('|');
        return _fnv1a(pieces);
    }
    _selfHash = _computeSelfHash();

    // --- Verify self integrity on every call ---
    function _verifySelf() {
        if (_computeSelfHash() !== _selfHash) {
            // Tampered — silently ghost everything
            return false;
        }
        // Also check if we're still frozen
        if (!Object.isFrozen(CONFIG) || !Object.isFrozen(LEXICON)) return false;
        return true;
    }

    // --- Strip invisible/zero-width chars ---
    function _stripInvisible(s) {
        let out = s;
        for (const c of CONFIG.INVISIBLE_CHARS) {
            out = out.split(c).join('');
        }
        // Also strip emoji ranges
        out = out.replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
        out = out.replace(/[\u{2600}-\u{27BF}]/gu, '');
        out = out.replace(/[\u{FE00}-\u{FE0F}]/gu, '');
        // Strip control chars except newline/tab
        out = out.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
        return out;
    }

    // --- Phonetic transform ---
    const _phonetize = (s) => s.replace(/[aeiouy]/g, char => CONFIG.VOWEL_MAP[char] || char);

    // --- Logging ---
    const _log = (msg, isViolation = false) => {
        try {
            const consoleEl = document.getElementById('server-console');
            if (!consoleEl) return;
            const div = document.createElement('div');
            const span = document.createElement('span');
            span.style.color = isViolation ? "#ff3366" : "#00ffcc";
            span.textContent = `[VAULT_SHIELD] `;
            div.appendChild(span);
            div.append(msg);
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        } catch (e) { /* DOM not ready — silent */ }
    };

    // --- Session expiry sweep ---
    function _reapStaleSessions() {
        const now = Date.now();
        for (const [uuid, s] of _sessions) {
            if (now - s.lastSeen > CONFIG.SESSION_TTL_MS) {
                _sessions.delete(uuid);
            }
        }
    }

    // --- Rate limiter ---
    function _checkRate(session) {
        const now = Date.now();
        if (!session.msgTs) session.msgTs = [];
        session.msgTs = session.msgTs.filter(t => now - t < CONFIG.RATE_LIMIT_WINDOW);
        if (session.msgTs.length >= CONFIG.RATE_LIMIT_MAX) {
            return false; // rate limited
        }
        session.msgTs.push(now);
        return true;
    }

    // --- Repeat detection ---
    function _isRepeat(session, message) {
        const now = Date.now();
        if (session.lastMsg && session.lastMsg === message && (now - session.lastMsgTs) < CONFIG.REPEAT_WINDOW) {
            return true;
        }
        session.lastMsg = message;
        session.lastMsgTs = now;
        return false;
    }

    // --- PUBLIC INTERFACE (deep frozen) ---
    const _api = {
        initSession: (uuid, username = "User") => {
            if (!uuid || typeof uuid !== 'string') return false;
            if (_sessions.has(uuid)) return false;

            _sessions.set(uuid, {
                username,
                integrity: CONFIG.INTEGRITY_MAX,
                isGhost: false,
                ghostIndex: Math.floor(Math.random() * CONFIG.GHOST_VARIETY.length),
                lastSeen: Date.now(),
                sensitiveHitTs: 0,
                msgTs: [],
                lastMsg: null,
                lastMsgTs: 0,
                createdAt: Date.now(),
            });
            _log(`System initialized for ${username}`);
            _reapStaleSessions();
            return true;
        },

        validate: function(uuid, message) {
            // Self-integrity check on every call
            if (!_verifySelf()) {
                const idx = Math.floor(Math.random() * CONFIG.GHOST_VARIETY.length);
                return { action: "GHOST", msg: CONFIG.GHOST_VARIETY[idx] };
            }

            const session = _sessions.get(uuid);

            // No session or already ghosted → ghost reply
            if (!session || session.isGhost) {
                const fallback = session || { ghostIndex: 0 };
                fallback.ghostIndex = ((fallback.ghostIndex || 0) + 1) % CONFIG.GHOST_VARIETY.length;
                return { action: "GHOST", msg: CONFIG.GHOST_VARIETY[fallback.ghostIndex] };
            }

            // Rate limit check
            if (!_checkRate(session)) {
                return { action: "DROP", msg: "" };
            }

            // Repeat detection
            if (_isRepeat(session, message)) {
                return { action: "DROP", msg: "" };
            }

            session.lastSeen = Date.now();

            // Input sanitization pipeline
            let n = String(message);
            n = _stripInvisible(n);           // Remove zero-width, emoji, control chars
            n = n.normalize("NFKC");           // Unicode normalization
            n = n.toLowerCase();              // Case fold

            // Remove exemption words before pattern matching
            LEXICON.EXEMPTIONS.forEach(safe => { n = n.split(safe).join(" "); });

            // Homoglyph substitution
            let mapped = "";
            for (let char of n) { mapped += CONFIG.HOMOGLYPH_MAP[char] || char; }

            // Final normalization passes
            const ultra = mapped.replace(/[^a-z0-9]/gi, '');
            const squashed = ultra.replace(/(.)\1+/g, '$1');       // de-duplicate
            const phonetic = _phonetize(squashed);                  // phonetic match

            // Length heuristic
            if (String(message).length > CONFIG.MAX_MSG_LEN) {
                session.integrity = Math.max(0, session.integrity - 20);
                _log(`Warning: Oversized message from ${session.username} (${String(message).length} chars)`);
                // Don't block, but flag for review
            }

            // Comprehensive Threat Scan — triple pass (ultra, squashed, phonetic)
            const categories = ["CRITICAL", "SENSITIVE"];
            for (let cat of categories) {
                for (let target of LEXICON[cat]) {
                    const targetPhon = _phonetize(target);

                    if (ultra.includes(target) || squashed.includes(target) || phonetic.includes(targetPhon)) {

                        if (cat === "SENSITIVE") {
                            const now = Date.now();
                            if (now - session.sensitiveHitTs > CONFIG.SENSITIVE_WINDOW) {
                                session.sensitiveHitTs = now;
                                _log(`Warning: Sensitive intent detected from ${session.username}`);
                                return { action: "DROP", msg: "" };
                            }
                            // Within window — escalate to ghost
                        }

                        // Perma-Ghosting
                        session.isGhost = true;
                        session.integrity = 0;
                        _log(`CRITICAL: ${session.username} has been ghosted.`, true);

                        session.ghostIndex = (session.ghostIndex + 1) % CONFIG.GHOST_VARIETY.length;
                        return { action: "GHOST", msg: CONFIG.GHOST_VARIETY[session.ghostIndex] };
                    }
                }
            }

            return { action: "ALLOW", msg: message };
        },

        // Session management
        endSession: (uuid) => {
            _sessions.delete(uuid);
        },

        getSessionInfo: (uuid) => {
            const s = _sessions.get(uuid);
            if (!s) return null;
            return {
                username: s.username,
                integrity: s.integrity,
                isGhost: s.isGhost,
                lastSeen: s.lastSeen,
            };
        },

        // Reap stale sessions (call periodically)
        reap: () => _reapStaleSessions(),

        // Integrity check for Attestation
        getFingerprint: () => _fnv1a(
            _api.validate.toString() + '|' +
            _api.initSession.toString() + '|' +
            Object.isFrozen(CONFIG) + '|' +
            Object.isFrozen(LEXICON)
        ),
    };

    // Deep freeze: make all properties non-configurable, non-writable
    Object.freeze(_api);
    Object.freeze(_api.initSession);
    Object.freeze(_api.validate);
    Object.freeze(_api.endSession);
    Object.freeze(_api.getSessionInfo);
    Object.freeze(_api.reap);
    Object.freeze(_api.getFingerprint);

    return _api;
})();

// Harden the global reference
try { Object.freeze(NeuralGuard); } catch (e) {}

// --- NETWORKING WITH GUARD INTEGRATION ---
function initNet() {
    const config = { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] };
    peer = new Peer('bm-v3-' + currentUser, { config: config });

    // Initialize Pentagom with our UUID
    Pentagom.init(currentUser);
    Pentagom.restore(); // Restore badlist from localStorage

    // Initialize AEGIS
    AEGIS.init();

    // Initialize NeuralGuard session for ourselves
    NeuralGuard.initSession(currentUser, currentUser);

    peer.on('open', (id) => {
        gLog("NET_READY: " + id);
        // Wire Attestation
        Attestation.setSendFn((peerId, msg) => {
            const conn = connections.find(c => c.peer === peerId);
            if (conn && conn.open) conn.send(msg);
        });
        Attestation.setBroadcastFn((msg) => {
            connections.forEach(c => { if (c.open) c.send(msg); });
        });
        Attestation.start(currentUser);
        myFriends.forEach(f => tryConnect(f));
    });

    peer.on('connection', setupConn);
    peer.on('error', err => { if(err.type === 'peer-unavailable') gLog("Peer offline."); });
}

function tryConnect(fName) {
    if(fName === currentUser) return;
    const conn = peer.connect('bm-v3-' + fName);
    setupConn(conn);
}

function setupConn(conn) {
    conn.on('open', () => {
        if(connections.find(c => c.peer === conn.peer)) return;
        connections.push(conn);

        // Attestation: notify of new peer connection
        const peerName = conn.peer.replace('bm-v3-', '');
        Attestation.onPeerConnect(conn.peer);

        // NeuralGuard: init session for this peer
        NeuralGuard.initSession(peerName, peerName);

        conn.send({ type: 'handshake', name: currentUser, acc: myAcc, hp: player.hp, mode: selectedMode, avatar: myCustomAvatar });
    });

    conn.on('data', data => {
        // Attestation handles its own packet types
        if (data.type === 'KEY_EXCHANGE' || data.type === 'ATTEST' ||
            data.type === 'CHALLENGE' || data.type === 'CHALLENGE_RESPONSE' ||
            data.type === 'ACCUSE' || data.type === 'EXECUTE') {
            Attestation.onData(conn.peer, data);
            return;
        }

        // Pentagom ban broadcast
        if (data.type === 'BAN') {
            Pentagom.handleBroadcast('BAN:' + data.target);
            return;
        }

        // Movement data — validate through Pentagom/GuardBridge
        if(data.type === 'move') {
            // Skip banned peers
            if (Pentagom.isBad(conn.peer)) return;

            // Validate movement through GuardBridge
            const frameResult = GuardBridge.checkFrame(conn.peer, {
                x: data.x, y: data.y, z: data.z, seq: data.seq, ts: Date.now()
            });

            if (frameResult.action === 'DROP' || frameResult.action === 'BAN' || frameResult.action === 'IGNORE') return;

            ghosts[data.name] = { ...ghosts[data.name], ...data, lastSeen: Date.now() };
            if(data.avatar && !ghosts[data.name].sprite) {
                ghosts[data.name].sprite = new Image();
                ghosts[data.name].sprite.src = data.avatar;
            }
        }

        if(data.type === 'handshake') {
            // Skip banned peers
            if (Pentagom.isBad(conn.peer)) return;

            ghosts[data.name] = { x: 128, y: 128, z: 0, name: data.name, acc: data.acc, hp: data.hp, mode: data.mode, lastSeen: Date.now(), avatar: data.avatar };
            if(data.avatar) {
                ghosts[data.name].sprite = new Image();
                ghosts[data.name].sprite.src = data.avatar;
            }
            addChat("SYSTEM", data.name + " LINKED");
        }

        if(data.type === 'chat') {
            // Skip banned peers
            if (Pentagom.isBad(conn.peer)) return;

            // Validate chat through GuardBridge (all 3 guards)
            const chatResult = GuardBridge.checkChat(data.name, currentUser, data.msg);

            if (chatResult.action === 'GHOST') {
                // Sender is ghosted — show ghost message instead of real message
                addChat(data.name, chatResult.sources.length > 0 ? "..." : data.msg);
                return;
            }
            if (chatResult.action === 'DROP' || chatResult.action === 'TERMINATE') {
                // Message blocked
                return;
            }
            if (chatResult.action === 'WARN' || chatResult.action === 'ALERT') {
                gLog("GUARD_WARN: " + data.name + " - " + (chatResult.signals || []).join(','));
            }

            addChat(data.name, data.msg);
        }

        if(data.type === 'damage' && data.target === currentUser) {
            player.hp -= 20;
            document.body.style.filter = "invert(0.1) sepia(1) saturate(5) hue-rotate(-50deg)";
            setTimeout(() => document.body.style.filter = "", 100);
            if(player.hp <= 0) respawn();
            broadcastStatus(); refreshUI();
        }

        if(data.type === 'ping') {
            conn.send({ type: 'move', x:player.x, y:player.y, z:player.z, dir:player.dir, name:currentUser, acc:myAcc, hp:player.hp, mode:selectedMode, avatar: myCustomAvatar, seq: moveSeq++ });
        }
    });

    conn.on('close', () => {
        connections = connections.filter(c => c.peer !== conn.peer);
        Attestation.onPeerDisconnect(conn.peer);
        const peerName = conn.peer.replace('bm-v3-', '');
        if (ghosts[peerName]) {
            delete ghosts[peerName];
            addChat("SYSTEM", peerName + " DISCONNECTED");
        }
    });
}

function broadcastStatus() {
    if(!peer || peer.disconnected) return;

    // Validate our own movement through Pentagom (local check)
    moveSeq++;
    connections.forEach(c => {
        if(c.open) {
            c.send({
                type:'move', x:player.x, y:player.y, z:player.z, dir:player.dir,
                name:currentUser, acc:myAcc, hp:player.hp, mode:selectedMode,
                avatar: myCustomAvatar, seq: moveSeq, ts: Date.now()
            });
        }
    });

    // Periodic Pentagom tick (reap stale sessions)
    if (moveSeq % 60 === 0) Pentagom.tick();
}

        }

function respawn() {
    player.hp = 100; player.x = 100; player.y = 100; player.z = 0;
    showGameMsg("REBOOTING..."); refreshUI();
}

function shoot() {
    if(selectedMode !== 'SURVIVAL' || shootTimer > 0) return;
    shootTimer = 15;
    const flash = document.getElementById('muzzle-flash');
    flash.style.display = 'block';
    setTimeout(() => flash.style.display = 'none', 50);

    Object.values(ghosts).forEach(g => {
        if (Pentagom.isBad('bm-v3-' + g.name)) return; // Skip banned peers
        let dx = g.x - player.x, dy = g.y - player.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let angle = Math.atan2(dy, dx) - player.dir;
        while(angle < -Math.PI) angle += Math.PI*2; while(angle > Math.PI) angle -= Math.PI*2;
        if(Math.abs(angle) < 0.2 && dist < 600) {
            if(Math.abs(angle) < 0.01 && dist > 450) {
                gLog("COMBAT_ANOMALY: " + currentUser + " perfect aim at distance.");
            }
            connections.forEach(c => c.send({type: 'damage', target: g.name}));
        }
    });
}

function loop() {
    if(!gameRunning) return;
    const now = Date.now();

    // Clean up stale ghosts
    Object.keys(ghosts).forEach(id => {
        let diff = now - ghosts[id].lastSeen;
        if(diff > 5000) {
            delete ghosts[id];
        } else if(diff > 2000) {
            let conn = connections.find(c => c.peer === 'bm-v3-' + id);
            if(conn && conn.open) conn.send({type: 'ping'});
        }
    });

    if(!isChatting) {
        let mv = 0, side = 0;
        if(isMobile) {
            mv = -touchMove.y * 3; side = touchMove.x * 2;
        } else {
            if(keys['KeyW']) mv = 3; if(keys['KeyS']) mv = -3;
            if(keys['KeyA']) side = -2; if(keys['KeyD']) side = 2;
            if(keys['Space'] && !player.isJumping) { player.vZ = 5; player.isJumping = true; }
        }

        player.z += player.vZ;
        if(player.z > 0) player.vZ -= 0.3; else { player.z = 0; player.vZ = 0; player.isJumping = false; }

        let nx = player.x + Math.cos(player.dir)*mv + Math.cos(player.dir+Math.PI/2)*side;
        let ny = player.y + Math.sin(player.dir)*mv + Math.sin(player.dir+Math.PI/2)*side;

        let tx = Math.floor(nx/TILE), ty = Math.floor(ny/TILE);
        let tile = (currentMap[ty] && currentMap[ty][tx]) || 0;
        let tileH = (tile === 1) ? 1000 : (tile === 4) ? 30 : 0;

        if(player.z >= tileH || tile === 0 || tile === 2 || tile === 3) {
            player.x = nx; player.y = ny;
            if(tile === 2) respawn();
            if(tile === 3) { showGameMsg("OBBY CLEAR!"); boomcoins += 50; saveData(); respawn(); }
        }
        broadcastStatus();

        if(selectedMode === 'SURVIVAL') {
            const sway = Math.sin(Date.now() * 0.005) * (mv !== 0 || side !== 0 ? 10 : 2);
            document.getElementById('gun-sprite').style.transform = 'skewX(-10deg) translateY(' + sway + 'px)';
        }
    }

    if(shootTimer > 0) shootTimer--;

    // Render
    const horizon = 180 + player.z;
    ctx.fillStyle = "#010"; ctx.fillRect(0,0,640,horizon);
    ctx.fillStyle = "#000"; ctx.fillRect(0,horizon,640,360-horizon);

    let zBuf = [];
    for(let i=0; i<80; i++) {
        let angle = (player.dir - 0.5) + (i/80);
        let d = 0, hit = 0;
        while(d < 800) {
            d += 4;
            let tx = Math.floor((player.x + Math.cos(angle)*d)/TILE), ty = Math.floor((player.y + Math.sin(angle)*d)/TILE);
            hit = (currentMap[ty] && currentMap[ty][tx]) || 0;
            if(hit === 1 || hit === 4) break;
        }
        zBuf[i] = d;
        let h = (8000 * (hit === 4 ? 0.4 : 1)) / (d * Math.cos(angle-player.dir));
        ctx.fillStyle = 'rgb(0, ' + Math.max(0, Math.floor(180-d/4)) + ', 0)';
        ctx.fillRect(i*8, horizon - h/2, 8, h);
    }

    // Render ghosts (skip banned)
    Object.values(ghosts).forEach(g => {
        if (Pentagom.isBad('bm-v3-' + g.name)) return;
        let dx = g.x - player.x, dy = g.y - player.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let angle = Math.atan2(dy, dx) - player.dir;
        while(angle < -Math.PI) angle += Math.PI*2; while(angle > Math.PI) angle -= Math.PI*2;
        if(Math.abs(angle) < 0.8) {
            let sx = (angle + 0.5) * 640;
            let h = 8000 / dist;
            let colIdx = Math.floor(sx/8);
            if(colIdx >= 0 && colIdx < 80 && dist < zBuf[colIdx]) {
                let gy = horizon - h/2 - (g.z * (h/TILE));
                if(g.sprite && g.sprite.complete) {
                    ctx.drawImage(g.sprite, sx - h/4, gy, h/2, h);
                } else {
                    ctx.fillStyle = (g.mode === 'SURVIVAL') ? "white" : "cyan";
                    ctx.fillRect(sx - h/4, gy, h/2, h);
                }
                if(g.acc === "Wings") {
                    ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
                    ctx.fillRect(sx - h/2, gy + h/4, h, h/10);
                } else if(g.acc === "Eye") {
                    ctx.fillStyle = "red";
                    ctx.fillRect(sx - 2, gy + 5, 4, 4);
                }
                ctx.fillStyle = "#0f0"; ctx.font = "10px Courier";
                ctx.fillText(g.name + ' [' + g.hp + '%]', sx - 20, gy - 10);
            }
        }
    });

    drawMinimap();

    // Update guard status display
    const gs = document.getElementById('guard-status');
    if (gameRunning) {
        gs.style.display = 'block';
        const verified = Attestation.getPeerStatus ? Object.keys(Attestation.getPeerStatus()).filter(k => Attestation.isPeerVerified(k)).length : 0;
        gs.innerText = 'PEERS:' + connections.length + ' VERIFIED:' + verified + ' BANS:' + (Pentagom.getBadlistSize ? Pentagom.getBadlistSize() : 0);
    }

    requestAnimationFrame(loop);
}

function drawMinimap() {
    mCtx.fillStyle = '#000'; mCtx.fillRect(0,0,120,120);
    const s = 120 / (currentMap.length * TILE);
    currentMap.forEach((row, y) => row.forEach((v, x) => {
        if(v === 1) mCtx.fillStyle = '#0f0'; else if(v === 4) mCtx.fillStyle = '#070';
        else if(v === 2) mCtx.fillStyle = '#f00'; else if(v === 3) mCtx.fillStyle = '#ff0';
        else return;
        mCtx.fillRect(x*TILE*s, y*TILE*s, TILE*s, TILE*s);
    }));
    mCtx.fillStyle = '#fff'; mCtx.fillRect(player.x*s-2, player.y*s-2, 4, 4);
}

// --- INPUTS & GUARD-INTEGRATED CHAT ---
window.onmousedown = () => { if(gameRunning && !isChatting && !isMobile) shoot(); };
window.onkeydown = e => {
    keys[e.code] = true;
    if(e.code === 'Enter' && gameRunning) {
        const inp = document.getElementById('chat-input');
        if(!isChatting) {
            isChatting = true; inp.style.display = 'block'; inp.focus();
            if(!isMobile) document.exitPointerLock();
        } else {
            if(inp.value) {
                // Run through GuardBridge (all 3 guards)
                const result = GuardBridge.checkChat(currentUser, 'broadcast', inp.value);

                if (result.action === 'ALLOW' || result.action === 'WARN') {
                    addChat(currentUser, inp.value);
                    // Only broadcast if not shadow-banned by any guard
                    if (result.action !== 'TERMINATE' && result.action !== 'GHOST') {
                        connections.forEach(c => c.send({type:'chat', name:currentUser, msg:inp.value}));
                    }
                } else if (result.action === 'GHOST') {
                    // User is ghosted — show a ghost message locally, don't broadcast real message
                    addChat(currentUser, inp.value);
                    gLog("GUARD_GHOST: Message blocked by guard stack - " + (result.signals || []).join(','));
                } else if (result.action === 'DROP') {
                    gLog("GUARD_DROP: Message dropped - " + (result.signals || []).join(','));
                } else if (result.action === 'TERMINATE') {
                    addChat("SYSTEM", "TRANSMISSION TERMINATED BY GUARD");
                    gLog("GUARD_TERMINATE: " + (result.signals || []).join(','));
                }

                if (result.signals && result.signals.length > 0) {
                    gLog("CHAT_SIGNALS: " + currentUser + " - " + result.signals.join(', '));
                }
            }
            inp.value = ""; inp.style.display = 'none'; isChatting = false;
            if(!isMobile) canvas.requestPointerLock();
        }
    }
};
window.onkeyup = e => keys[e.code] = false;
window.onmousemove = e => { if(document.pointerLockElement) player.dir += e.movementX * 0.003; };

function addChat(u, m) {
    const l = document.getElementById('chat-log');
    l.innerHTML += '<div><b>' + u + ':</b> ' + m + '</div>';
    l.scrollTop = l.scrollHeight;
}

function setAcc(a) { myAcc = a; saveData(); refreshUI(); broadcastStatus(); }

function addFriend() {
    const n = document.getElementById('f-search').value.trim();
    if(n && !myFriends.includes(n)) { myFriends.push(n); saveData(); updateSocialUI(); tryConnect(n); }
}

function updateSocialUI() {
    document.getElementById('friend-list').innerHTML = myFriends.map(f => {
        const isBanned = Pentagom.isBad ? Pentagom.isBad('bm-v3-' + f) : false;
        return '<div class="item">' + f + ' <span style="color:' + (isBanned ? 'var(--red)' : 'var(--cyan)') + '">' + (isBanned ? 'BANNED' : 'ONLINE') + '</span><br><button class="rep-btn" onclick="reportPlayer(\'' + f + '\')">REPORT</button></div>';
    }).join('');
}

function reportPlayer(targetName) {
    const ghost = ghosts[targetName];
    gLog("MANUAL_REPORT: " + targetName + " LOC:[" + (ghost ? Math.floor(ghost.x) : '???') + "," + (ghost ? Math.floor(ghost.y) : '???') + "]");
    showGameMsg("REPORT SENT: " + targetName);
}

function saveData() {
    let users = JSON.parse(localStorage.getItem('bm_v3_users') || '{}');
    if(!users[currentUser]) users[currentUser] = {};
    users[currentUser].coins = boomcoins; users[currentUser].friends = myFriends;
    users[currentUser].acc = myAcc; users[currentUser].avatar = myCustomAvatar;
    localStorage.setItem('bm_v3_users', JSON.stringify(users));
    Pentagom.persist(); // Save badlist too
}

function claimDaily() { boomcoins += 100; saveData(); refreshUI(); alert("100 CREDITS TRANSFERRED."); }
</script>
